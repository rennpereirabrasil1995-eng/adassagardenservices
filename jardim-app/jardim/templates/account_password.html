{% extends "base.html" %}
{% from "_account.html" import sub_head with context %}
{% block title %}{{ t('account.change_password') }} – {% endblock %}
{% block content %}
{{ sub_head(t('account.change_password'), t('account.password_hint')) }}
<form method="post" class="sheet pad stack">
  {{ csrf_field() }}
  <label>{{ t('account.current_password') }}
    <input type="password" name="current_password" autocomplete="current-password" required>
  </label>
  <label>{{ t('account.new_password') }}
    <input type="password" name="new_password" autocomplete="new-password" minlength="8" required>
    <span class="hint">{{ t('setup.password_hint') }}</span>
  </label>
  <label>{{ t('account.confirm_password') }}
    <input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required>
  </label>
  <div class="actions"><button class="btn primary" type="submit">{{ t('account.submit') }}</button></div>
</form>
{% endblock %}
